<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy-click | Маркетплейс</title>
    <style>
        /* Базові стилі прямо тут, щоб уникнути помилки MIME-типу styles.css */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; color: #333; }
        .site-header { background-color: #2c3e50; color: white; padding: 20px; text-align: center; }
        .site-nav ul { list-style: none; padding: 0; background: #34495e; margin: 0; display: flex; justify-content: center; }
        .site-nav a { display: block; color: white; padding: 14px 20px; text-decoration: none; font-weight: bold; }
        .site-nav a:hover { background-color: #1abc9c; }
        .card-list { display: flex; flex-wrap: wrap; gap: 20px; padding: 40px; justify-content: center; min-height: 60vh; }
        .product-card { background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); padding: 20px; width: 250px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .card-img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; background-color: #eaeaea; display: flex; align-items: center; justify-content: center; color: #7f8c8d; font-size: 14px; }
        .card-title { font-size: 18px; margin: 15px 0 10px; color: #2c3e50; }
        .card-price { font-size: 16px; font-weight: bold; color: #e74c3c; margin-bottom: 15px; }
        .card-btn { background-color: #2ecc71; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .card-btn:hover { background-color: #27ae60; }
        .site-footer { background-color: #2c3e50; color: #bdc3c7; text-align: center; padding: 15px; position: relative; bottom: 0; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="module" src="./src/index.js"></script>
</body>
</html>
